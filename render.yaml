services:
  # ── 1. Backend Web Service (FastAPI) ──────────────────────────────
  - type: web
    name: modellens-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false # Set your Groq API key in Render Dashboard
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-120b

  # ── 2. Frontend Static Site (Vite + React) ────────────────────────
  - type: web
    name: modellens-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: modellens-backend
          property: host
